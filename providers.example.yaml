asr:
  provider: elevenlabs
  model_id: scribe_v2
  diarize: true
  # Optional LOCAL-only ASR comparison path. This is used only when the CLI is
  # run with --local; normal sync/generate runs keep the ElevenLabs settings above.
  # local:
  #   provider: gemini_transcribe
  #   model: gemini-3.5-transcribe
  #   language_codes: ["de-DE"]
  #   diarize: true
  #   word_timestamps: true
  #   store: false
  #   custom_vocabulary:
  #     - Drachen-Evolutionssystem

llm:
  provider: openai
  model: gpt-5.6-luna
  # OPENAI_API_KEY is read from the environment unless api_key is set here.
  # GEMINI_API_KEY is required for the default adjudication and punctuation sub-passes below.
  timeout_seconds: 90
  max_retries: 2
  adjudication:
    provider: gemini
    model: gemini-3.7-flash
    confidence_gate: 0.7
    scene_gap_seconds: 4.0
    thinking_level: high
    audio_snippet_double_check:
      enabled: true
      pad_seconds: 2.0
      max_duration_seconds: 20.0
  punctuation:
    provider: gemini
    model: gemini-3.7-flash
    scene_gap_seconds: 4.0
    thinking_level: medium
  speaker_mapping:
    reasoning_effort: medium
  # Optional for providers/models without built-in token price defaults:
  # input_per_million: 1.0
  # output_per_million: 6.0

overlap_detection:
  provider: pyannote
  model: pyannote/speaker-diarization-community-1

forced_alignment:
  provider: mms
  language: deu
  romanize: true
  batch_size: 4

vad:
  provider: energy
  threshold_dbfs: -45.0
  window_ms: 100
  min_region_ms: 100
  min_coverage: 0.2

generation:
  max_gap_seconds: 0.8
  max_cue_duration_seconds: 5.0

speaker_mapping:
  # Use provider: llm to infer speaker clusters from subtitle context with the configured llm.
  # provider: llm
  # Or keep deterministic explicit mappings:
  # fixture:
  #   SPEAKER_00: Luna
