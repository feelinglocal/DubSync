asr:
  provider: elevenlabs
  model_id: scribe_v2
  # ELEVENLABS_API_KEY is read from the environment.
  # Optional alternative: provider: openrouter, model: microsoft/mai-transcribe-2
  # MAI uses OPENROUTER_API_KEY and remains available in the web model picker.
  diarize: true

llm:
  provider: openai
  model: gpt-5.6-luna
  # OPENAI_API_KEY is read from the environment unless api_key is set here.
  # GEMINI_API_KEY is required for the default adjudication and punctuation sub-passes below.
  timeout_seconds: 90
  max_retries: 2
  adjudication:
    provider: gemini
    model: gemini-3.8-flash
    confidence_gate: 0.7
    scene_gap_seconds: 4.0
    max_batch_spans: 8
    max_concurrent_batches: 4
    retry_timed_out_batches: true
    thinking_level: medium
    audio_context:
      enabled: true
      compress_long_audio: true
      cache_enabled: true
      cache_ttl_seconds: 900
      max_uncached_audio_tokens: 256000
    audio_snippet_double_check:
      enabled: true
      pad_seconds: 2.0
      max_duration_seconds: 20.0
  punctuation:
    provider: gemini
    model: gemini-3.7-flash
    scene_gap_seconds: 4.0
    thinking_level: medium
  speaker_mapping:
    reasoning_effort: medium
  # Optional for providers/models without built-in token price defaults:
  # input_per_million: 1.0
  # output_per_million: 6.0

overlap_detection:
  provider: pyannote
  model: pyannote/speaker-diarization-community-1

forced_alignment:
  provider: mms
  language: deu
  romanize: true
  batch_size: 4

vad:
  provider: energy
  threshold_dbfs: -45.0
  window_ms: 100
  min_region_ms: 100
  min_coverage: 0.2

generation:
  max_gap_seconds: 0.8
  max_cue_duration_seconds: 5.0

speaker_mapping:
  # Use provider: llm to infer speaker clusters from subtitle context with the configured llm.
  # provider: llm
  # Or keep deterministic explicit mappings:
  # fixture:
  #   SPEAKER_00: Luna
