asr:
  # Default: Microsoft MAI-Transcribe 2 via OpenRouter (OPENROUTER_API_KEY).
  # Alternative: provider: elevenlabs, model_id: scribe_v2 (ELEVENLABS_API_KEY).
  # The web model picker can select either model per job.
  provider: openrouter
  model: microsoft/mai-transcribe-2
  diarize: true
  # Optional: improve ASR spelling for names/terms in the episode.
  # keyterms:
  #   - Drachen-Evolutionssystem
  # character_names:
  #   - Luna
  #   - Matthew

adjudication:
  # Follow the actor's performed register. Set script to keep authored variants.
  register_policy: spoken

llm:
  provider: openai
  model: gpt-5.6-luna
  timeout_seconds: 90
  max_retries: 2
  adjudication:
    provider: gemini
    model: gemini-3.8-flash
    confidence_gate: 0.7
    scene_gap_seconds: 4.0
    max_batch_spans: 8
    max_concurrent_batches: 4
    retry_timed_out_batches: true
    thinking_level: medium
    fallback:
      # Optional hybrid: set primary to gemini-3.5-flash-lite/high, then enable.
      enabled: false
      provider: gemini
      model: gemini-3.8-flash
      thinking_level: medium
    audio_context:
      # Focused audio clips and bounded local source context support each decision.
      enabled: false
      compress_long_audio: true
      cache_enabled: true
      cache_ttl_seconds: 900
      max_uncached_audio_tokens: 256000
    audio_snippet_double_check:
      enabled: true
      pad_seconds: 2.0
      max_duration_seconds: 20.0
  punctuation:
    provider: gemini
    model: gemini-3.7-flash
    scene_gap_seconds: 4.0
    thinking_level: medium
  speaker_mapping:
    reasoning_effort: medium

vad:
  provider: energy
  # Energy VAD: 10 ms hop, thresholds adapt to each file's speech level and
  # noise floor. Optional overrides: threshold_dbfs (absolute on-threshold),
  # window_ms (non-overlapping analysis windows), min_region_ms, merge_gap_ms,
  # hysteresis_db, edge_rise_db.
  min_coverage: 0.2
  boundary_refinement:
    enabled: true
    start_pad_ms: 40
    end_pad_ms: 40
    max_end_extension_ms: 300
    max_leading_silence_ms: 150
    max_trailing_silence_ms: 300

timing:
  max_word_duration: 2.0
  max_intra_cue_gap: 1.5
  # extend_into_silence: a cue shorter than the minimum display time stays up
  # while nothing else is heard and no other cue starts. acoustic: it ends
  # with its speech.
  min_duration_policy: extend_into_silence
  # ASR phrase edges are moved onto the edge of the speech burst they belong
  # to. Measured on Scribe v2 and MAI-Transcribe 2 the same windows fit both,
  # so no per-model values are set; models.<asr model id> can override them.
  # Where a recording's phrase starts lag their speech onsets as a rule (Scribe
  # Japanese), a start up to lagging_start_advance_ms after the onset moves
  # back too, if the energy VAD hears the phrase from the onset on; 0 disables.
  # phrase_edge_snap:
  #   start_advance_ms: 200
  #   end_extension_ms: 300
  #   lagging_start_advance_ms: 700
  #   models:
  #     scribe_v2: {start_advance_ms: 200}
  max_cps: 30
  min_cps: 2

generation:
  max_gap_seconds: 0.8
  max_cue_duration_seconds: 5.0
  # Fail closed when an ASR-only span looks like a missing section of the source SRT.
  max_generated_adlib_duration_seconds: 20.0

output:
  no_overlaps: true

# Optional local overlap backstop. Requires pyannote model access and a
# HUGGINGFACE_ACCESS_TOKEN in .env.
# overlap_detection:
#   provider: pyannote
#   model: pyannote/speaker-diarization-community-1

# Optional speaker-character inference. This can spend LLM tokens.
# speaker_mapping:
#   provider: llm

# Optional precision alignment. This is commented out because ctc-forced-aligner
# needs Microsoft Visual C++ Build Tools before it can install on this machine.
# forced_alignment:
#   provider: mms
#   language: deu
#   romanize: true
#   batch_size: 4
